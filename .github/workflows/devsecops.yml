```yaml
name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build & Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          pytest -v

  sast-scan:
    name: Semgrep SAST Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python for SAST
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep CLI
        run: |
          pip install semgrep

      - name: Run Semgrep SAST with Quality Gate
        run: |
          # Quality Gate: --error flag membuat workflow exit 1 (gagal) jika ada finding berkategori ERROR
          semgrep scan --config auto --error --exclude=tests